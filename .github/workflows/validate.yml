name: Validate scenario control flow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  control-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Validation~/BehaviorScenarioValidation.csproj --configuration Release
